name: Construire l'APK Matchlab

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Matchlab-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Matchlab.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Matchlab 1.1.${{ github.run_number }}
          body: "Téléchargez Matchlab.apk ci-dessous et installez-le sur votre téléphone."
          files: Matchlab.apk
